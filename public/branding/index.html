<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Branding · Bàn làm việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--den:#0B0B0B;--den2:#161616;--den3:#222;--xam:#6B6B6B;--xam2:#A3A3A3;--vien:#E4E4E4;--nen:#F4F4F2;--trang:#fff;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{font:14px/1.55 Arimo,Arial,sans-serif;color:var(--den);background:var(--nen);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}

/* ---------- khung ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sb{background:var(--den);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:22px 20px 18px;border-bottom:1px solid #222}
.logo b{display:block;font:700 22px/1 Arimo;letter-spacing:6px}
.logo span{display:block;font-size:11.5px;color:var(--xam2);margin-top:8px;letter-spacing:.5px}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.nav .h{font:700 10.5px/1 Arimo;letter-spacing:2.4px;color:#777;padding:10px 12px 8px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:11px 12px;color:#D6D6D6;cursor:pointer;transition:.15s}
.nav button:hover{background:#1B1B1B;color:#fff}
.nav button.on{background:#fff;color:var(--den)}
.nav button i{font:700 12px/1 Arimo;font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.nav button.on i{background:var(--den);color:#fff;border-color:var(--den)}
.nav button span{font-weight:600;font-size:14px;line-height:1.25}
.nav button small{display:block;font-weight:400;font-size:11px;opacity:.6;margin-top:2px}
.sbf{margin-top:auto;padding:16px 20px;border-top:1px solid #222;font-size:11.5px;color:#8a8a8a;line-height:1.5}
.sbf b{color:#fff;font-weight:600}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.sb{position:static;height:auto}.nav{flex-direction:row;overflow:auto}.nav .h,.sbf{display:none}.nav button{flex:none}}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:5}
.top h1{font:700 18px/1.2 Arimo;margin-right:auto}
.top h1 small{display:block;font:400 12px Arimo;color:var(--xam);margin-top:3px}
select.da{border:1px solid var(--vien);border-radius:8px;padding:8px 10px;background:#fff;max-width:260px}
.nut{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;padding:9px 14px;background:var(--den);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.nut:hover{background:#2a2a2a}
.nut.v{background:#fff;color:var(--den);box-shadow:inset 0 0 0 1.5px var(--vien)}
.nut.v:hover{box-shadow:inset 0 0 0 1.5px var(--den)}
.nut.nho{padding:6px 10px;font-size:12px}
.luu{font-size:12px;color:var(--xam)}

.wrap{display:grid;grid-template-columns:minmax(360px,470px) 1fr;gap:22px;padding:22px 24px 60px;align-items:start}
@media(max-width:1180px){.wrap{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--vien);border-radius:var(--r);padding:16px 18px}
.card>h3{font:700 11.5px/1.3 Arimo;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3 small{margin-left:auto;font:400 12px Arimo;letter-spacing:0;text-transform:none;color:var(--xam)}
.card>h3 .so{width:22px;height:22px;border-radius:50%;background:var(--den);color:#fff;display:grid;place-items:center;font-size:11px;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f:last-child{margin-bottom:0}
.f label{font:600 11.5px Arimo;color:var(--xam)}
.f input,.f textarea,.f select{border:1px solid var(--vien);border-radius:7px;padding:8px 10px;background:#fff;width:100%}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:var(--den)}
.goi{font-size:12px;color:var(--xam)}

/* goi dich vu */
.gc{border:1px solid var(--vien);border-radius:9px;margin-bottom:10px;overflow:hidden}
.gc .gh{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#FAFAF8;border-bottom:1px solid var(--vien)}
.gc .gh .bd{width:24px;height:24px;border-radius:50%;background:var(--den);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.gc .gh input{flex:1;border:0;background:none;font-weight:700;padding:4px}
.gc .gh input:focus{outline:0;background:#fff}
.gc .gh .tong{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--xam2);cursor:pointer;font-size:16px;line-height:1;padding:4px}
.x:hover{color:var(--den)}
.it{display:grid;grid-template-columns:1fr 54px 104px 22px;gap:6px;padding:6px 10px;align-items:center;border-bottom:1px dashed #eee}
.it input{border:1px solid transparent;border-radius:5px;padding:5px 6px;background:none;width:100%;font-size:13px}
.it input:hover{border-color:var(--vien)} .it input:focus{outline:0;border-color:var(--den);background:#fff}
.it input.so{text-align:right}
.gf{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--xam);flex-wrap:wrap}
.gf label{display:flex;align-items:center;gap:5px;cursor:pointer}
.gf input[type=text]{border:1px solid var(--vien);border-radius:6px;padding:5px 8px;width:130px;text-align:right}

/* checklist danh muc */
.dm h4{font:700 12px Arimo;letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px;color:var(--xam)}
.dm h4:first-child{margin-top:0}
.dm label{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.dm label:hover{background:#F6F6F4}
.dm label em{font-style:normal;color:var(--xam);font-size:12px;white-space:nowrap}
.dm input{accent-color:var(--den);width:16px;height:16px}
.ck label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px;cursor:pointer}
.ck input{accent-color:var(--den);margin-top:3px;width:15px;height:15px;flex:none}
.them{display:flex;gap:6px;margin-top:6px}
.them input{flex:1;border:1px solid var(--vien);border-radius:7px;padding:7px 9px}
.dong{display:grid;grid-template-columns:62px 1fr 22px;gap:6px;align-items:center;margin-bottom:6px}
.dong input{border:1px solid var(--vien);border-radius:6px;padding:6px 8px;width:100%}
.dong.b3{grid-template-columns:1fr 110px 22px}
.tag{display:flex;flex-wrap:wrap;gap:6px}
.tag button{border:1.5px solid var(--vien);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.tag button.on{background:var(--den);border-color:var(--den);color:#fff}
.tc{display:grid;grid-template-columns:92px 1fr 92px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:8px}
.tc span:last-child{text-align:right}
.tc input{accent-color:var(--den)}
.mau{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mau .o{display:flex;flex-direction:column;align-items:center;gap:3px}
.mau input[type=color]{width:46px;height:46px;border:1px solid var(--vien);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.mau input[type=text]{width:70px;border:1px solid var(--vien);border-radius:5px;padding:3px 4px;font-size:11px;text-align:center}
.mb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mb .o{aspect-ratio:1;border-radius:7px;background:#F2F2F0 center/cover;position:relative;border:1px dashed #d4d4d4;display:grid;place-items:center;color:var(--xam2);cursor:pointer;font-size:20px}
.mb .o.co{border-style:solid}
.mb .o .x{position:absolute;right:2px;top:2px;background:#fff;border-radius:50%;width:20px;height:20px;padding:0;font-size:12px}

/* ---------- tong quan ---------- */
.sb .dv{padding:14px 20px;border-bottom:1px solid #222}
.sb .dv a{color:#aaa;text-decoration:none;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.sb .dv a:hover{color:#fff}
.sb .dv b{display:block;font-size:16px;line-height:1.3;margin-top:10px;color:#fff}
.sb .dv span{display:block;font-size:11.5px;color:#8a8a8a;margin-top:3px}
.sb .dv .pb{height:4px;background:#2a2a2a;border-radius:9px;margin-top:10px;overflow:hidden}
.sb .dv .pb i{display:block;height:100%;background:#fff}
.nav button.xong i{background:#fff;color:#0B0B0B;border-color:#fff}
.nav button.on.xong i{background:#0B0B0B;color:#fff;border-color:#0B0B0B}
.nav button em{margin-left:auto;font-style:normal;font-size:11.5px;opacity:.6}
.sbt{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 16px}
.sbt .nut{background:#1c1c1c;color:#ddd}
.sbt .nut:hover{background:#2a2a2a}
.dash{padding:22px 24px 60px;max-width:1380px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1000px){.stat{grid-template-columns:repeat(2,1fr)}}
.stat div{background:#fff;border:1px solid var(--vien);border-radius:var(--r);padding:14px 16px}
.stat div.den{background:var(--den);color:#fff;border-color:var(--den)}
.stat small{display:block;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--xam)}
.stat div.den small{color:#999}
.stat b{display:block;font-size:24px;margin-top:6px;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--xam)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb input[type=search]{flex:1;min-width:220px;border:1px solid var(--vien);border-radius:8px;padding:9px 12px;background:#fff}
.tb select{border:1px solid var(--vien);border-radius:8px;padding:8px 10px;background:#fff}
.chip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip button{border:1.5px solid var(--vien);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip button.on{background:var(--den);color:#fff;border-color:var(--den)}
.chip button i{font-style:normal;opacity:.55;margin-left:4px;font-weight:400}
.bang2{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--vien);border-radius:var(--r);overflow:hidden}
.bang2 th{text-align:left;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--xam);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--vien);background:#FAFAF8;white-space:nowrap}
.bang2 td{padding:11px 12px;border-bottom:1px solid #F0F0EE;vertical-align:middle;font-size:13.5px}
.bang2 tr:last-child td{border-bottom:0}
.bang2 tbody tr{cursor:pointer;transition:.12s}
.bang2 tbody tr:hover{background:#F7F7F5}
.bang2 td b{display:block;font-weight:700}
.bang2 td small{color:var(--xam);font-size:12px}
.bang2 .s{text-align:right;white-space:nowrap}
.ma{font:600 12px/1 Arimo;color:var(--xam);white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1.5px solid transparent}
.pill.tiemnang{background:#F1F1EF;color:#555}
.pill.baogia{background:#E6E6E3;color:#222}
.pill.kyhd{background:#CFCFCB;color:#111}
.pill.thietke{background:#555;color:#fff}
.pill.bangiao{background:#222;color:#fff}
.pill.xong{background:#0B0B0B;color:#fff}
.pill.dung{background:#fff;color:#999;border-color:#ddd;text-decoration:line-through}
.buoc{display:flex;gap:3px}
.buoc i{width:18px;height:6px;border-radius:9px;background:#E4E4E2}
.buoc i.x{background:#0B0B0B}
.trang{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:12px;font-size:12.5px;color:var(--xam)}
.trang button{border:1px solid var(--vien);background:#fff;border-radius:7px;min-width:32px;padding:6px 9px;cursor:pointer}
.trang button.on{background:var(--den);color:#fff;border-color:var(--den)}
.rong{text-align:center;padding:50px 20px;color:var(--xam)}
.hdsd{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0 6px}
@media(max-width:1100px){.hdsd{grid-template-columns:repeat(3,1fr)}}
.hdsd div{background:#fff;border:1px solid var(--vien);border-radius:var(--r);padding:12px 13px;font-size:12.5px;color:var(--xam);line-height:1.45}
.hdsd b{display:flex;gap:8px;align-items:center;color:var(--den);font-size:13.5px;margin-bottom:5px}
.hdsd b i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--den);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.xongb{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1.5px dashed #cfcfcb;border-radius:var(--r);padding:12px 14px;font-size:13px}
.xongb.ok{border-style:solid;border-color:var(--den)}
.giao .r{display:grid;grid-template-columns:110px 1fr 22px;gap:6px;align-items:center;margin-bottom:6px}
.giao .r select,.giao .r input{border:1px solid var(--vien);border-radius:6px;padding:6px 8px;width:100%;font-size:13px}
.giao .r .ln{grid-column:2/3}
.thu{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed #eee}
.thu:last-child{border:0}
.thu b{font-size:13.5px}
.thu small{display:block;color:var(--xam);font-size:12px}
.thu .c{display:flex;gap:6px;align-items:center}
.thu input[type=date]{border:1px solid var(--vien);border-radius:6px;padding:5px 6px;font-size:12px}
.thu label{display:flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600;cursor:pointer}
.thu input[type=checkbox]{accent-color:var(--den);width:16px;height:16px}
.doc .bb td,.doc .bb th{font-size:10pt}
.doc .kv2{display:grid;grid-template-columns:150pt 1fr;gap:3pt 10pt;font-size:10pt;margin-bottom:6pt}
.doc .kv2 b{font-weight:600;color:#555}
.doc h2.sec{font-size:10.5pt;letter-spacing:2px;text-transform:uppercase;margin:14pt 0 6pt;padding-bottom:4pt;border-bottom:2px solid #0B0B0B}
.doc .qa{border-bottom:1px solid #eee;padding:5pt 0;font-size:10pt;break-inside:avoid}
.doc .qa b{display:block;font-weight:700;margin-bottom:2pt}
.doc .qa span.tr{display:block;min-height:22pt;border-bottom:1px dotted #aaa}
.doc .hs{background:#0B0B0B;color:#fff;margin:-18mm -18mm 12pt;padding:16mm 18mm 12mm}
.doc .hs .k{font-size:9pt;letter-spacing:3px;text-transform:uppercase;color:#aaa}
.doc .hs h1{font-size:26pt;margin:6pt 0 4pt;line-height:1.1}
.doc .hs p{color:#ccc;font-size:10pt}
.doc .tien6{display:grid;grid-template-columns:repeat(6,1fr);gap:5pt;margin:6pt 0}
.doc .tien6 div{border:1px solid #ddd;border-radius:6px;padding:6pt;font-size:8.5pt;text-align:center}
.doc .tien6 div.x{background:#0B0B0B;color:#fff;border-color:#0B0B0B}
.doc .tien6 b{display:block;font-size:13pt}

/* ---------- kanban ---------- */
.dash{max-width:none;min-width:0}
.stat>div{min-width:0}
@media(max-width:700px){.dash{padding:14px 12px 40px}.stat{grid-template-columns:1fr 1fr;gap:8px}.stat b{font-size:17px}.stat span{display:none}.tb input[type=search]{min-width:0;flex:1 1 100%;order:-1}.kcol{flex-basis:82vw}.top{padding:12px 14px}.hdsd{display:none}}
main{min-width:0}
.app>main{overflow-x:hidden}
.vw{display:inline-flex;background:#fff;border:1px solid var(--vien);border-radius:8px;padding:3px}
.vw button{border:0;background:none;border-radius:6px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--xam)}
.vw button.on{background:var(--den);color:#fff}
.kb{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start;scroll-snap-type:x proximity}
.kcol{flex:0 0 276px;background:#EAEAE7;border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;max-height:calc(100vh - 250px);scroll-snap-align:start}
.kcol.gon{flex:0 0 50px;cursor:pointer;min-height:220px;align-items:center}
.kcol.gon .kh2{writing-mode:vertical-rl;transform:rotate(180deg);flex-direction:row-reverse;gap:10px}
.kcol.gon .kh2 small,.kcol.gon .kl,.kcol.gon .kadd{display:none}
.kh2{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
.kh2 b{font-size:13.5px}
.kh2 .dem{font-size:11.5px;font-weight:700;background:#fff;border-radius:99px;padding:2px 8px}
.kh2 small{margin-left:auto;font-size:11.5px;color:var(--xam);white-space:nowrap}
.kh2 button{border:0;background:none;cursor:pointer;color:var(--xam);font-size:15px;padding:0 2px}
.kcol[data-tt=xong] .kh2 .dem,.kcol[data-tt=thietke] .kh2 .dem{background:var(--den);color:#fff}
.kl{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:36px;padding:2px;border-radius:9px;transition:background .15s}
.kl.keo{background:rgba(11,11,11,.06);outline:2px dashed #bbb;outline-offset:-2px}
.kc{background:#fff;border-radius:9px;padding:10px 11px 9px;box-shadow:0 1px 0 rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.04);cursor:grab;position:relative;transition:box-shadow .12s,transform .12s}
.kc:hover{box-shadow:0 0 0 1.5px var(--den)}
.kc.dang{opacity:.35}
.kc .lb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.kc .lb span{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;background:#EFEFEC;color:#444}
.kc .lb span.tre{background:#0B0B0B;color:#fff}
.kc .lb span.gan{background:#FFE9A8;color:#6b4d00}
.kc b{display:block;font-size:13.5px;line-height:1.35}
.kc small{display:block;color:var(--xam);font-size:12px;margin-top:1px}
.kc .kf{display:flex;align-items:center;gap:8px;margin-top:9px}
.kc .kf .buoc i{width:14px;height:5px}
.kc .kf em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700}
.kc .kf .pt{font-size:10.5px;color:var(--xam);font-weight:600}
.kc .mo6{display:flex;gap:3px;margin-top:8px;opacity:0;transition:.15s}
.kc:hover .mo6{opacity:1}
.kc .mo6 a{flex:1;text-align:center;font-size:10.5px;font-weight:700;text-decoration:none;border-radius:5px;padding:4px 0;background:#F2F2EF;color:#333}
.kc .mo6 a:hover{background:var(--den);color:#fff}
.kc .mo6 a.x{background:#0B0B0B;color:#fff}
@media(hover:none){.kc .mo6{opacity:1}}
.kadd{margin-top:8px}
.kadd input{width:100%;border:0;border-radius:8px;padding:9px 10px;background:transparent;font-size:13px}
.kadd input:hover{background:rgba(255,255,255,.6)}
.kadd input:focus{outline:0;background:#fff;box-shadow:0 0 0 1.5px var(--den)}
.ph-kc{height:4px;border-radius:9px;background:var(--den);margin:-2px 0}
/* ngan keo (drawer) */
.man{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.man.on{opacity:1;pointer-events:auto}
.ngan{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:41;transform:translateX(102%);transition:transform .22s;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.ngan.on{transform:none}
.ngan .nh{position:sticky;top:0;background:var(--den);color:#fff;padding:16px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.ngan .nh b{display:block;font-size:17px;line-height:1.3}
.ngan .nh small{display:block;color:#aaa;font-size:12px;margin-top:3px}
.ngan .nh button{margin-left:auto;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1}

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const tien = n => (Math.round(+n || 0)).toLocaleString('vi-VN').replace(/,/g, '.');
const soTien = s => +String(s).replace(/[^\d]/g, '') || 0;
const KEY = 'branding-ws-v1';
const TT = {tiemnang:'Tiềm năng', baogia:'Đang báo giá', kyhd:'Đã ký hợp đồng', thietke:'Đang thiết kế', bangiao:'Đang bàn giao', xong:'Hoàn tất', dung:'Tạm dừng / huỷ'};
const STEPS = [['kh','Thông tin khách hàng','Hồ sơ dự án, thông tin hai bên'],['brief','Bảng thu thập thông tin','Brief: hiểu khách hàng trước khi báo giá'],['bg','Checklist báo giá','Chọn hạng mục, ra báo giá gửi khách'],['hd','Hợp đồng','Hợp đồng dịch vụ chuyên gia'],['dh','Định hướng thương hiệu','Chiến lược, định vị, cá tính, hình ảnh'],['giao','Bàn giao','Nghiệm thu, bàn giao file, thu tiền']];

/* ---------- ben B mac dinh ---------- */
const CG = {ten:'Nguyễn Quốc Khánh', danh:'Chuyên gia tư vấn & thiết kế thương hiệu', cccd:'', dc:'', dt:'0988 886 901', email:'hi@nguyenquockhanh.vn', stk:'', nh:''};

/* ---------- danh muc hang muc (gia tham khao, sua duoc) ---------- */
const DM = [
  ['Chiến lược', [
    ['Định hướng sáng tạo (creative direction)', 2000000, 'gói'],
    ['Nghiên cứu & chiến lược thương hiệu', 0, 'gói'],
    ['Đặt tên thương hiệu / slogan', 0, 'gói']]],
  ['Logo & nhận diện', [
    ['Thiết kế logo', 9000000, 'bộ'],
    ['Quy chuẩn sử dụng logo (logo guideline)', 3000000, 'bộ'],
    ['Logo & Brand Guideline trọn gói', 25000000, 'gói'],
    ['Hệ hoa văn / họa tiết thương hiệu', 0, 'bộ']]],
  ['Ấn phẩm', [
    ['Ấn phẩm văn phòng (danh thiếp, tiêu đề thư, bìa thư…)', 500000, 'món'],
    ['Hồ sơ năng lực (company profile)', 300000, 'trang'],
    ['Ấn phẩm số (avatar, cover, mẫu bài đăng…)', 6500000, 'bộ'],
    ['Catalogue / brochure', 0, 'trang']]],
  ['Bao bì', [
    ['Concept bao bì chính thức', 7500000, 'concept'],
    ['Phiên bản triển khai thêm', 2500000, 'phiên bản'],
    ['Túi giấy', 1000000, 'mẫu'],
    ['Ly giấy', 500000, 'mẫu']]],
  ['Digital & website', [
    ['Thiết kế website', 18000000, 'gói'],
    ['SEO & content marketing', 4500000, 'tháng'],
    ['Quản trị & đăng bài Facebook', 3500000, 'tháng']]]
];
const CUNGCAP = ['Thông tin pháp lý doanh nghiệp (tên, MST, địa chỉ)', 'Logo, tài liệu nhận diện hiện có (nếu có)', 'Hình ảnh sản phẩm / dịch vụ', 'Nội dung chữ cho các ấn phẩm', 'Thông tin liên hệ, fanpage, website', 'Đối thủ và thương hiệu tham khảo', 'Mẫu thiết kế yêu thích / không thích', 'Người phụ trách duyệt thiết kế'];
const BAOGOM = ['File thiết kế gốc (AI, PDF) và file dùng ngay (PNG, JPG)', 'Tối đa 03 lần chỉnh sửa mỗi hạng mục', 'Tư vấn triển khai, làm việc với nhà in', 'Hướng dẫn sử dụng file bàn giao'];
const KHONGGOM = ['Chi phí in ấn, sản xuất', 'Bản quyền hình ảnh, font chữ trả phí', 'Chụp ảnh sản phẩm', 'Đăng ký bảo hộ nhãn hiệu', 'Thuế, phí phát sinh ngoài hợp đồng'];
const QUYTRINH = [['Tiếp nhận brief, thống nhất phạm vi', '1–2 ngày'], ['Nghiên cứu & định hướng sáng tạo', '3–5 ngày'], ['Thiết kế phương án đề xuất', '7–10 ngày'], ['Chỉnh sửa theo góp ý', '5–7 ngày'], ['Hoàn thiện & bàn giao', '2–3 ngày']];
const TCACH = [['Truyền thống','Hiện đại'], ['Nghiêm túc','Vui tươi'], ['Bình dân','Cao cấp'], ['Mộc mạc','Tinh xảo'], ['Trầm lắng','Năng động'], ['Tối giản','Phong phú']];
const TUKHOA = ['Tin cậy','Bền vững','Tự nhiên','Tinh tế','Sáng tạo','Gần gũi','Chuyên nghiệp','Bản địa','Di sản','Trẻ trung','Sang trọng','Ấm áp','Mạnh mẽ','Chân thật','Đổi mới'];
const FONTHUONG = ['Serif cổ điển','Sans hiện đại','Sans hình học','Chữ viết tay','Slab','Display cá tính'];

/* ---------- du an ---------- */
const hom = () => new Date().toISOString().slice(0, 10);
function soHD(ngay){ const [y,m,d] = ngay.split('-'); return `${d}${m}${y.slice(2)}/BRANDING`; }
function moiDA(){
  const n = hom();
  return { id: 'da' + Date.now() + Math.random().toString(36).slice(2, 6), ten: 'Dự án mới', ngay: n, so: soMoi(n), hieuluc: '30 ngày',
    tt: 'tiemnang', xong: {}, hanChot: '', xep: null, linhVuc: '', nguon: '', ghiChuDA: '', tao: Date.now(), capNhat: Date.now(),
    br: {hm: []}, giao: {items: [], ngay: '', thu: [], doc: 'bb', ghiChu: ''},
    kh: {loai:'tc', cty:'', dd:'', cv:'', mst:'', dc:'', dt:'', email:''},
    b: {...CG}, veViec: '', noiKy: '', toaAn: 'TP. Đà Nẵng', thue: 'chua', portfolio: true,
    goi: [],
    vat: 0, dot: [{pt:70, dk:'Ngay sau khi ký hợp đồng / xác nhận báo giá'}, {pt:30, dk:'Khi bàn giao file hoàn chỉnh'}],
    tg: '20', sua: '03', banGiao: 'AI, PDF, PNG, JPG',
    cc: CUNGCAP.slice(0, 5), bao: [...BAOGOM], khong: [...KHONGGOM], qt: QUYTRINH.map(x => [...x]),
    dh: {ten:'', nganh:'', boiCanh:'', doiTuong:'', insight:'', tamNhin:'', suMenh:'', gt:[['',''],['',''],['','']],
      tc:[50,50,50,50,50,50], dvDoiTuong:'', dvNganh:'', dvLoiIch:'', dvLyDo:'', slogan:'', tk:[], mau:['#0B0B0B','#FFFFFF','#B8B8B8'], font:[], doiThu:'', ghiChu:'', mb:[]}
  };
}
let DS = [], P = null;
function soMoi(n){ let so = soHD(n), k = 1; while (DS.some(d => d.so === so)){ k++; so = soHD(n).replace('/', '-' + k + '/'); } return so; }
function chuanHoa(d){ const m = moiDA();
  Object.keys(m).forEach(k => { if (d[k] === undefined) d[k] = m[k]; });
  if (!d.b || d.b.cty !== undefined) d.b = {...CG};
  if (!d.kh.loai) d.kh.loai = 'tc'; d.vat = 0;
  if (/ngày/.test(String(d.tg))) d.tg = String(d.tg).replace(/\D+/g, '') || '20';
  d.goi.forEach(g => { if (g.mo === undefined) g.mo = ''; if (g.tl === undefined) g.tl = ''; });
  if (!d.br.hm) d.br.hm = []; if (!d.giao.thu) d.giao.thu = [];
  return d; }
/* IndexedDB: chua duoc hang tram du an kem anh moodboard */
const KHO = { db: null,
  mo(){ return new Promise(ok => { try { const r = indexedDB.open('branding-ws', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('da', {keyPath: 'id'});
    r.onsuccess = () => { this.db = r.result; ok(true); }; r.onerror = () => ok(false); } catch(e){ ok(false); } }); },
  tx(m){ return this.db.transaction('da', m).objectStore('da'); },
  tatCa(){ return new Promise(ok => { if (!this.db) return ok(JSON.parse(localStorage.getItem(KEY + '-ds') || '[]'));
    const r = this.tx('readonly').getAll(); r.onsuccess = () => ok(r.result || []); r.onerror = () => ok([]); }); },
  ghi(d){ if (!this.db){ try { localStorage.setItem(KEY + '-ds', JSON.stringify(DS)); } catch(e){ return Promise.reject(e); } return Promise.resolve(); }
    return new Promise((ok, loi) => { const r = this.tx('readwrite').put(JSON.parse(JSON.stringify(d))); r.onsuccess = ok; r.onerror = () => loi(r.error); }); },
  xoa(id){ if (!this.db){ localStorage.setItem(KEY + '-ds', JSON.stringify(DS)); return Promise.resolve(); }
    return new Promise(ok => { const r = this.tx('readwrite').delete(id); r.onsuccess = ok; r.onerror = ok; }); }
};
async function nap(){
  await KHO.mo(); DS = await KHO.tatCa();
  if (!DS.length){ try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.ds){ DS = o.ds; for (const d of DS){ chuanHoa(d); await KHO.ghi(d); } } } catch(e){} }
  DS.forEach(chuanHoa);
}
let hl; function luu(){ if (!P) return; P.capNhat = Date.now(); $('#luu').textContent = 'Đang lưu…'; clearTimeout(hl); const d = P; hl = setTimeout(() => {
  KHO.ghi(d).then(() => $('#luu').textContent = 'Đã lưu ' + new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'}))
    .catch(() => $('#luu').textContent = 'Không lưu được — hãy Sao lưu ra file'); }, 350); }
function veDS(){ veSB(); }

/* ---------- tinh tien ---------- */
const giaGoi = g => g.tay !== '' && g.tay != null ? soTien(g.tay) : g.it.reduce((s, i) => s + (+i.sl || 0) * (+i.dg || 0), 0);
function tongTien(){ const t = P.goi.reduce((s, g) => s + giaGoi(g), 0), v = Math.round(t * (+P.vat || 0) / 100); return {t, v, c: t + v}; }
function docSo(n){
  n = Math.round(n); if (!n) return 'Không đồng';
  const cs = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const ba = (x, du) => { const tr = Math.floor(x / 100), ch = Math.floor(x % 100 / 10), dv = x % 10; let r = [];
    if (du || tr) r.push(cs[tr] + ' trăm');
    if (ch > 1) r.push(cs[ch] + ' mươi'); else if (ch === 1) r.push('mười'); else if ((du || tr) && dv) r.push('lẻ');
    if (dv) r.push(dv === 1 && ch > 1 ? 'mốt' : dv === 5 && ch ? 'lăm' : dv === 4 && ch > 1 ? 'tư' : cs[dv]);
    return r.join(' '); };
  const dvi = ['', ' nghìn', ' triệu', ' tỷ']; let nhom = [], i = 0;
  while (n > 0){ nhom.push(n % 1000); n = Math.floor(n / 1000); }
  let r = [];
  for (i = nhom.length - 1; i >= 0; i--){ if (!nhom[i]) continue; r.push(ba(nhom[i], i < nhom.length - 1) + dvi[i % 4] + (i >= 4 ? ' tỷ' : '')); }
  const s = r.join(' ').replace(/\s+/g, ' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

/* ---------- tien do ---------- */
function xongBuoc(d, k){
  if (d.xong && d.xong[k]) return true;
  if (k === 'kh') return !!(d.kh.cty && (d.kh.dt || d.kh.email));
  if (k === 'brief') return brDien(d) >= Math.ceil(brTong() * .7);
  if (k === 'giao') return d.giao.items.length > 0 && d.giao.items.every(x => x.tt === 'duyet');
  return false;
}
const soXong = d => STEPS.filter(([k]) => xongBuoc(d, k)).length;
function tongDA(d){ const t = d.goi.reduce((s, g) => s + giaGoi(g), 0); return t; }
function thuDA(d){ const T = tongDA(d); return d.dot.reduce((s, x, i) => s + (d.giao.thu && d.giao.thu[i]?.da ? T * x.pt / 100 : 0), 0); }
const nutXong = k => `<div class="xongb ${P.xong[k] ? 'ok' : ''}"><span>${P.xong[k] ? '✓ Bước này đã hoàn thành' : 'Xong bước này? Đánh dấu để theo dõi tiến độ dự án.'}</span><button class="nut ${P.xong[k] ? 'v' : ''} nho" id="danhDau">${P.xong[k] ? 'Bỏ đánh dấu' : '✓ Hoàn thành'}</button></div>`;

  <li>Phản hồi mẫu thiết kế trong vòng 02 (hai) ngày để tránh ảnh hưởng đến tiến độ. Quá 05 (năm) ngày kể từ khi nhận mẫu mà Bên A không có ý kiến phản hồi cụ thể thì mẫu thiết kế mặc nhiên được coi là đã được Bên A phê duyệt.</li>
  <li>Thanh toán đầy đủ, đúng hạn theo Điều 2. Trường hợp chậm thanh toán, Bên A chịu phạt 0,05% tổng giá trị hợp đồng cho mỗi ngày chậm. Trường hợp Bên A chưa thanh toán đủ mà tự ý sử dụng thiết kế (hoặc ý tưởng, bản chỉnh sửa từ thiết kế) của Bên B, Bên B có quyền căn cứ tài liệu thiết kế để yêu cầu cơ quan có thẩm quyền giải quyết.</li>
  <li>Sau khi nhận bàn giao, Bên A tự chịu trách nhiệm đăng ký bảo hộ nhãn hiệu cho mẫu thiết kế. Trường hợp Bên A sử dụng dịch vụ tư vấn đăng ký nhãn hiệu của Bên B, hai bên thống nhất bằng một hợp đồng riêng.</li></ul>
  <p><b>3.2. Trách nhiệm của Bên B</b></p>
  <ul><li>Thực hiện công việc với tư cách chuyên gia độc lập, tự chủ về phương pháp và thời gian làm việc; hợp đồng này không phát sinh quan hệ lao động giữa hai bên.</li>
  <li>Thiết kế hoàn toàn mới, không sao chép, trùng lặp với thiết kế hiện có của tổ chức, cá nhân khác; chịu trách nhiệm pháp lý về tài liệu và mẫu thiết kế bàn giao cho Bên A.</li>
  <li>Đảm bảo tiến độ theo khoản 1.2 Điều 1. Trường hợp chậm tiến độ do lỗi của Bên B, Bên B chịu phạt 0,05% tổng giá trị hợp đồng cho mỗi ngày chậm, tối đa 10 (mười) ngày. Chậm quá 10 (mười) ngày làm việc mà không có thỏa thuận với Bên A thì Bên A có quyền chấm dứt hợp đồng và Bên B hoàn trả toàn bộ số tiền Bên A đã thanh toán.</li>
  <li>Tài liệu Bên A cung cấp và sản phẩm thiết kế sau nghiệm thu, bàn giao thuộc quyền sở hữu của Bên A; Bên B không sử dụng hoặc tiết lộ cho bên thứ ba khi chưa được Bên A đồng ý${P.portfolio ? bien(', trừ việc sử dụng hình ảnh sản phẩm đã được Bên A công bố ra thị trường để giới thiệu năng lực chuyên môn (portfolio) của Bên B') : ''}.</li></ul>

  <div class="dieu">Điều 4: Kết quả và nghiệm thu</div>
  <p>4.1. Sau khi Bên B hoàn thành sản phẩm theo yêu cầu, hai bên tiến hành bàn giao và nghiệm thu sản phẩm.</p>
  <p>4.2. Bên A cử nhân sự có chuyên môn để nghiệm thu khi Bên B có yêu cầu bàn giao.</p>
  <p>4.3. Sau khi đã bàn giao và nghiệm thu, mọi yêu cầu sửa đổi của Bên A được tính chi phí riêng theo thỏa thuận.</p>
  <p>4.4. Hai bên ký biên bản nghiệm thu các hạng mục tại Điều 1. Trường hợp Bên A không xác nhận nghiệm thu, hợp đồng mặc nhiên được nghiệm thu sau 07 (bảy) ngày kể từ ngày Bên A nhận được văn bản đề nghị nghiệm thu.</p>

  <div class="dieu">Điều 5: Xử lý phát sinh</div>
  <p><b>5.1. Bổ sung hạng mục</b>: trường hợp Bên A muốn bổ sung hạng mục so với hợp đồng, hai bên thống nhất chi phí, thời gian thực hiện và các nội dung liên quan bằng phụ lục hợp đồng.</p>
  <p><b>5.2. Chấm dứt hợp đồng trước hạn</b></p>
  <ul><li>Trường hợp hợp đồng chấm dứt theo đề nghị của Bên A, chi phí được tính theo khối lượng công việc Bên B đã thực hiện:</li></ul>
  <table class="bang"><tr><th style="width:60pt">Giai đoạn</th><th>Tiến độ công việc</th><th style="width:120pt">Chi phí</th></tr>
    <tr><td>1</td><td>Từ khi ký hợp đồng đến khi gửi mẫu lần 1</td><td>30% giá trị hợp đồng</td></tr>
    <tr><td>2</td><td>Sau khi gửi mẫu thiết kế lần 2</td><td>40% giá trị hợp đồng</td></tr>
    <tr><td>3</td><td>Sau khi gửi mẫu thiết kế lần 3</td><td>50% giá trị hợp đồng</td></tr></table>
  <ul><li>Bên B không được đơn phương chấm dứt hợp đồng, trừ trường hợp bất khả kháng và được Bên A đồng ý; khi đó Bên B hoàn trả toàn bộ số tiền Bên A đã thanh toán.</li></ul>

  <div class="dieu">Điều 6: Giải quyết tranh chấp</div>
  <p>6.1. Hai bên cam kết thực hiện đúng các điều khoản của hợp đồng; vướng mắc phát sinh được giải quyết trên tinh thần thương lượng.</p>
  <p>6.2. Trường hợp không thương lượng được, tranh chấp được đưa ra Tòa án có thẩm quyền tại ${bien(esc(P.toaAn || 'TP. Đà Nẵng'))} giải quyết. Chi phí và thiệt hại phát sinh từ tranh chấp do bên có lỗi chịu theo quyết định của Tòa án.</p>

  <div class="dieu">Điều 7: Điều khoản chung</div>
  <p>7.1. Hợp đồng có hiệu lực từ ngày ký và được thanh lý khi hai bên hoàn thành các nghĩa vụ trong hợp đồng; không bên nào được tự ý hủy hợp đồng ngoài các trường hợp tại Điều 5.</p>
  <p>7.2. Hợp đồng được lập thành 02 (hai) bản, kèm phụ lục (nếu có), mỗi bên giữ 01 (một) bản có giá trị pháp lý như nhau.</p>
  <div class="ky"><div>ĐẠI DIỆN BÊN A<small>(Ký, ghi rõ họ tên${A.loai === 'cn' ? '' : ', đóng dấu'})</small>${bien(esc(tenA.replace(/^(Ông|Bà)\s+/i, '')))}</div><div>BÊN B – CHUYÊN GIA<small>(Ký, ghi rõ họ tên)</small>${bien(esc(B.ten))}</div></div>`;
}

  return con < 0 ? `<span class="tre">Trễ ${-con} ngày</span>` : con <= 3 ? `<span class="gan">⏱ ${n} · còn ${con} ngày</span>` : `<span>⏱ ${n}</span>`;
}

  const ds = locDS(true);
  return `<div class="kb" id="kb">${Object.entries(TT).map(([k, t]) => {
    const c = ds.filter(d => d.tt === k).sort((a, b) => khoaXep(a) - khoaXep(b)), gia = c.reduce((s, d) => s + tongDA(d), 0);
    return `<section class="kcol ${F.gon[k] ? 'gon' : ''}" data-tt="${k}">
      <div class="kh2" ${F.gon[k] ? `data-mocot="${k}"` : ''}><b>${t}</b><span class="dem">${c.length}</span>${gia ? `<small>${tien(gia)}</small>` : '<small></small>'}${F.gon[k] ? '' : `<button data-gon="${k}" title="Thu gọn cột">‹</button>`}</div>
      <div class="kl" data-tt="${k}">${c.map(theKC).join('')}</div>
      <div class="kadd"><input data-them-cot="${k}" placeholder="＋ Thêm dự án, gõ tên rồi Enter"></div></section>`; }).join('')}</div>`;
}
function veBang(){
  let ds = locDS();
  ds.sort({moi: (a, b) => b.capNhat - a.capNhat, ngay: (a, b) => (b.ngay || '').localeCompare(a.ngay || ''), gia: (a, b) => tongDA(b) - tongDA(a), ten: (a, b) => (a.ten || '').localeCompare(b.ten || '', 'vi')}[F.sx]);
  const TR = 20, soTr = Math.max(1, Math.ceil(ds.length / TR)); F.trang = Math.min(F.trang, soTr);
  const trang = ds.slice((F.trang - 1) * TR, F.trang * TR);
  return `<div class="chip">${[['dang','Đang thực hiện'],['all','Tất cả'], ...Object.entries(TT)].map(([k, t]) => `<button data-loc="${k}" class="${F.tt === k ? 'on' : ''}">${t}<i>${DS.filter(d => k === 'all' ? true : k === 'dang' ? !['xong','dung'].includes(d.tt) : d.tt === k).length}</i></button>`).join('')}</div>
    ${trang.length ? `<table class="bang2"><thead><tr><th>Mã</th><th>Dự án · Khách hàng</th><th>Trạng thái</th><th>6 bước</th><th>Hạn chót</th><th class="s">Giá trị</th><th class="s">Đã thu</th><th></th></tr></thead><tbody>
      ${trang.map(d => `<tr data-mo="${d.id}"><td class="ma">${esc(d.so)}</td><td><b>${esc(d.ten || 'Không tên')}</b><small>${esc(d.kh.cty || 'Chưa có khách hàng')}${d.linhVuc ? ' · ' + esc(d.linhVuc) : ''}</small></td>
        <td><span class="pill ${d.tt}">${TT[d.tt]}</span></td><td><div class="buoc" title="${soXong(d)}/6 bước">${STEPS.map(([k, t]) => `<i class="${xongBuoc(d, k) ? 'x' : ''}" title="${t}"></i>`).join('')}</div></td>
        <td><small>${d.hanChot ? d.hanChot.split('-').reverse().join('/') : '—'}</small></td>
        <td class="s">${tien(tongDA(d))}</td><td class="s">${tien(thuDA(d))}</td>
        <td class="s"><button class="nut v nho" data-nb="${d.id}" title="Tạo dự án mới từ dự án này">Nhân bản</button></td></tr>`).join('')}</tbody></table>
      <div class="trang">${ds.length} dự án${soTr > 1 ? ' · ' + Array.from({length: soTr}, (_, i) => `<button data-tr="${i + 1}" class="${F.trang === i + 1 ? 'on' : ''}">${i + 1}</button>`).join('') : ''}</div>`
    : `<div class="rong">${DS.length ? 'Không có dự án phù hợp bộ lọc.' : 'Chưa có dự án nào. Bấm <b>＋ Dự án mới</b> để bắt đầu.'}</div>`}`;
}
function veDash(){
  const giaTri = DS.filter(d => !['tiemnang','baogia','dung'].includes(d.tt));
  const tongHD = giaTri.reduce((s, d) => s + tongDA(d), 0), thu = DS.reduce((s, d) => s + thuDA(d), 0);
  const tre = DS.filter(d => d.hanChot && !['xong','dung'].includes(d.tt) && new Date(d.hanChot + 'T23:59:59') < new Date()).length;
  const nams = [...new Set(DS.map(d => (d.ngay || '').slice(0, 4)))].filter(Boolean).sort().reverse();
  const cuon = $('#kb') ? $('#kb').scrollLeft : 0;
  $('#vDash').innerHTML = `
    <div class="stat">
      <div class="den"><small>Đang thực hiện</small><b>${DS.filter(d => !['xong','dung'].includes(d.tt)).length}</b><span>${tre ? tre + ' dự án trễ hạn' : 'trên tổng ' + DS.length + ' dự án'}</span></div>
      <div><small>Giá trị đã ký</small><b>${tien(tongHD)} đ</b><span>${giaTri.length} hợp đồng</span></div>
      <div><small>Đã thu</small><b>${tien(thu)} đ</b><span>${tongHD ? Math.round(thu / tongHD * 100) : 0}% giá trị đã ký</span></div>
      <div><small>Còn phải thu</small><b>${tien(Math.max(0, tongHD - thu))} đ</b><span>từ các hợp đồng đã ký</span></div></div>
    <div class="tb"><span class="vw"><button data-view="kanban" class="${F.view === 'kanban' ? 'on' : ''}">▦ Bảng Kanban</button><button data-view="bang" class="${F.view === 'bang' ? 'on' : ''}">☰ Danh sách</button></span>
      <input type="search" id="tim" placeholder="Tìm dự án, khách hàng, mã, số điện thoại…" value="${esc(F.q)}">
      <select id="locNam"><option value="all">Mọi năm</option>${nams.map(n => `<option ${F.nam === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
      ${F.view === 'bang' ? `<select id="sapXep"><option value="moi">Mới cập nhật</option><option value="ngay">Ngày ký</option><option value="gia">Giá trị cao</option><option value="ten">Tên A–Z</option></select>` : ''}
      <button class="nut" id="moi2">＋ Dự án mới</button></div>
    ${F.view === 'kanban' ? veKanban() : veBang()}
    ${F.view === 'kanban' ? '<div class="goi" style="margin-top:4px">Kéo thẻ sang cột khác để đổi trạng thái · bấm thẻ để nhập nhanh và xuất văn bản · số 1–6 dưới thẻ mở thẳng từng bước.</div>' : ''}
    <div class="hdsd">${STEPS.map(([k, t, m], i) => `<div><b><i>${i + 1}</i>${t}</b>${m}</div>`).join('')}</div>`;
  if ($('#sapXep')) $('#sapXep').value = F.sx;
  if ($('#kb')) $('#kb').scrollLeft = cuon;
  ganKeo();
}

/* ---------- keo tha kanban ---------- */
let keoId = null;
function ganKeo(){
  $$('.kc').forEach(c => {
    c.ondragstart = e => { keoId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', keoId); } catch(_){} setTimeout(() => c.classList.add('dang'), 0); };
    c.ondragend = () => { c.classList.remove('dang'); $$('.kl').forEach(l => l.classList.remove('keo')); $$('.ph-kc').forEach(x => x.remove()); };
  });
  $$('.kl').forEach(l => {
    l.ondragover = e => { if (!keoId) return; e.preventDefault(); l.classList.add('keo');
      $$('.ph-kc').forEach(x => x.remove()); const sau = sauThe(l, e.clientY), ph = document.createElement('div'); ph.className = 'ph-kc';
      sau ? l.insertBefore(ph, sau) : l.appendChild(ph); };
    l.ondragleave = e => { if (!l.contains(e.relatedTarget)) { l.classList.remove('keo'); $$('.ph-kc').forEach(x => x.remove()); } };
    l.ondrop = e => { e.preventDefault(); const d = DS.find(x => x.id === keoId); if (!d) return;
      const sau = sauThe(l, e.clientY), cot = l.dataset.tt;
      const c = DS.filter(x => x.tt === cot && x.id !== d.id).sort((a, b) => khoaXep(a) - khoaXep(b));
      const i = sau ? c.findIndex(x => x.id === sau.dataset.id) : c.length;
      const truoc = c[i - 1], sau2 = c[i];
      d.xep = truoc && sau2 ? (khoaXep(truoc) + khoaXep(sau2)) / 2 : sau2 ? khoaXep(sau2) - 1000 : truoc ? khoaXep(truoc) + 1000 : 0;
      const doi = d.tt !== cot; d.tt = cot; keoId = null; luuDA(d); veDash(); veSB();
      if (doi) bao(`Đã chuyển “${d.ten}” sang ${TT[cot]}`); };
  });
}
function sauThe(l, y){ return [...l.querySelectorAll('.kc:not(.dang)')].find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }); }
function luuDA(d){ d.capNhat = Date.now(); KHO.ghi(d).catch(() => bao('Không lưu được — hãy Sao lưu ra file')); }

/* ---------- ngan keo nhap nhanh ---------- */
let NG = null;
function moNgan(id){ NG = DS.find(x => x.id === id); if (!NG) return; veNgan(); $('#ngan').classList.add('on'); $('#man').classList.add('on'); }
function dongNgan(){ NG = null; $('#ngan').classList.remove('on'); $('#man').classList.remove('on'); if (!P) veDash(); }
function veNgan(){
  const d = NG, T = tongDA(d), th = thuDA(d);
  const o = (lab, k, type) => `<div class="f"><label>${lab}</label><input data-ng="${k}" ${type ? `type="${type}"` : ''} value="${esc(k.split('.').reduce((a, x) => a?.[x], d) ?? '')}"></div>`;
  $('#ngan').innerHTML = `<div class="nh"><div><b>${esc(d.ten || 'Không tên')}</b><small>${esc(d.so)} · ${TT[d.tt]}</small></div><button id="dongNg" title="Đóng">✕</button></div>
  <div class="nb2">
    <h4>Nhập nhanh</h4>
    ${o('Tên dự án', 'ten')}
    <div class="g2">${o('Khách hàng', 'kh.cty')}${o('Điện thoại', 'kh.dt')}</div>
    <div class="g2"><div class="f"><label>Trạng thái</label><select data-ng="tt">${Object.entries(TT).map(([k, v]) => `<option value="${k}" ${d.tt === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>${o('Hạn chót', 'hanChot', 'date')}</div>
    <div class="f"><label>Ghi chú</label><textarea data-ng="ghiChuDA" rows="2">${esc(d.ghiChuDA)}</textarea></div>
    <h4>Tiền</h4>
    <div class="tien3"><div><small>Giá trị</small><b>${tien(T)}</b></div><div><small>Đã thu</small><b>${tien(th)}</b></div><div><small>Còn lại</small><b>${tien(T - th)}</b></div></div>
    <h4>Tiến độ 6 bước <span style="float:right;letter-spacing:0;text-transform:none">${soXong(d)}/6</span></h4>
    <div class="bb6">${STEPS.map(([k, t], i) => { const x = xongBuoc(d, k); return `<label class="${x ? 'x' : ''}"><input type="checkbox" data-ngx="${k}" ${x ? 'checked' : ''}><i>${x ? '✓' : i + 1}</i><span>${t}</span><a href="#/p/${d.id}/${k}">Mở →</a></label>`; }).join('')}</div>
    <h4>Xuất văn bản (In / Lưu PDF)</h4>
    <div class="xp">${[['kh','Hồ sơ dự án'],['brief','Bảng thông tin'],['bg','Báo giá'],['hd','Hợp đồng'],['dh','Định hướng'],['giao','Biên bản bàn giao']].map(([k, t]) => `<button class="nut v nho" data-xuat="${k}">⤓ ${t}</button>`).join('')}</div>
    <h4>Thao tác</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="nut" href="#/p/${d.id}/kh">Mở dự án</a><button class="nut v" data-nb="${d.id}">Nhân bản</button><button class="nut v" data-xoang="${d.id}">Xoá</button></div>
  </div>`;
}
$('#man').onclick = dongNgan;
$('#ngan').addEventListener('input', e => { const k = e.target.dataset.ng; if (!k || !NG) return;
  const ks = k.split('.'), l = ks.pop(); ks.reduce((a, x) => a[x], NG)[l] = e.target.value; luuDA(NG);
  if (k === 'ten' || k === 'tt') $('#ngan .nh').innerHTML = `<div><b>${esc(NG.ten || 'Không tên')}</b><small>${esc(NG.so)} · ${TT[NG.tt]}</small></div><button id="dongNg" title="Đóng">✕</button>`; });
$('#ngan').addEventListener('change', e => { const k = e.target.dataset.ngx; if (!k || !NG) return;
  NG.xong = NG.xong || {}; NG.xong[k] = e.target.checked;
  if (e.target.checked){ const len = {bg: 'baogia', hd: 'thietke', giao: 'xong'}[k], tt = Object.keys(TT); if (len && tt.indexOf(NG.tt) < tt.indexOf(len)) NG.tt = len; }
  luuDA(NG); veNgan(); });
let IN_SAU = false;

/* ---------- dieu huong ---------- */
function moDA(id, buoc){ location.hash = `#/p/${id}/${buoc || 'kh'}`; }
async function taoMoi(tu){
  let d = tu ? JSON.parse(JSON.stringify(tu)) : moiDA();
  if (tu){ const m = moiDA(); Object.assign(d, {id: m.id, ten: tu.ten + ' (bản sao)', ngay: m.ngay, so: soMoi(m.ngay), tt: 'tiemnang', xong: {}, tao: Date.now(), capNhat: Date.now(),
    kh: {...m.kh}, br: {hm: []}, giao: m.giao}); }
  DS.unshift(d); await KHO.ghi(d); moDA(d.id, 'kh'); bao(tu ? 'Đã tạo dự án mới từ bản cũ: giữ hạng mục, giá, điều khoản; xoá thông tin khách' : 'Đã tạo dự án mới');
}
function dinhTuyen(){
  const m = location.hash.match(/^#\/p\/([^/]+)\/?(\w+)?/);
  if (m){ const d = DS.find(x => x.id === m[1]); if (d){ P = d; VIEW = STEPS.some(s => s[0] === m[2]) ? m[2] : 'kh'; veTat(); window.scrollTo(0, 0);
    if (IN_SAU){ IN_SAU = false; setTimeout(() => $('#inPDF').click(), 350); } return; } }
  P = null; veTat();
}
window.addEventListener('hashchange', dinhTuyen);
document.addEventListener('click', async e => {
  const kc = e.target.closest('.kc'); if (kc && !e.target.closest('a')) return moNgan(kc.dataset.id);
  if (e.target.closest('#ngan a')) { $('#ngan').classList.remove('on'); $('#man').classList.remove('on'); }
  const b = e.target.closest('button,tr[data-mo],[data-mocot]'); if (!b) return; const d = b.dataset;
  if (d.mocot){ F.gon[d.mocot] = false; return veDash(); }
  if (d.gon){ F.gon[d.gon] = true; return veDash(); }
  if (d.view){ F.view = d.view; try { localStorage.setItem('branding-view', F.view); } catch(_){} if (P) { location.hash = '#/'; return; } veSB(); return veDash(); }
  if (b.id === 'dongNg') return dongNgan();
  if (d.xuat && NG){ const id = NG.id; dongNgan(); IN_SAU = true; return moDA(id, d.xuat); }
  if (d.xoang){ const x = DS.find(y => y.id === d.xoang); if (!x || !confirm('Xoá dự án "' + x.ten + '"? Không khôi phục được nếu chưa sao lưu.')) return;
    DS = DS.filter(y => y.id !== x.id); await KHO.xoa(x.id); dongNgan(); veTat(); return bao('Đã xoá dự án'); }
  if (d.nb){ e.stopPropagation(); if (NG) { $('#ngan').classList.remove('on'); $('#man').classList.remove('on'); NG = null; } return taoMoi(DS.find(x => x.id === d.nb)); }
  if (d.mo) return moDA(d.mo);
  if (d.v && b.closest('#sb')) return moDA(P.id, d.v);
  if (d.loc){ F.tt = d.loc; F.trang = 1; if (b.closest('#sb')) F.view = 'bang'; if (P) location.hash = '#/'; else veTat(); return; }
  if (d.tr){ F.trang = +d.tr; return veDash(); }
  if (b.id === 'moi' || b.id === 'moi2') return taoMoi();
  if (b.id === 'nhan') return taoMoi(P);
  if (b.id === 'xoa'){ if (!confirm('Xoá dự án "' + P.ten + '"? Không khôi phục được nếu chưa sao lưu.')) return;
    const id = P.id; DS = DS.filter(x => x.id !== id); await KHO.xoa(id); location.hash = '#/'; return bao('Đã xoá dự án'); }
  if (b.id === 'saoLuu') return taiFile(new Blob([JSON.stringify({ds: DS}, null, 1)], {type:'application/json'}), `sao-luu-branding_${DS.length}-du-an_${hom()}.json`);
  if (b.id === 'khoiP') return $('#khoiPhuc').click();
});
document.addEventListener('keydown', async e => {
  const c = e.target.dataset && e.target.dataset.themCot;
  if (e.key === 'Escape' && NG) return dongNgan();
  if (!c || e.key !== 'Enter' || !e.target.value.trim()) return;
  const d = moiDA(); d.ten = e.target.value.trim(); d.tt = c; d.xep = Math.max(0, ...DS.filter(x => x.tt === c).map(khoaXep)) + 1000;
  DS.unshift(d); await KHO.ghi(d); veDash(); veSB(); const i = $(`[data-them-cot="${c}"]`); if (i) i.focus(); bao('Đã thêm “' + d.ten + '” · bấm thẻ để nhập tiếp');
});
document.addEventListener('input', e => {
  if (e.target.id === 'tim'){ F.q = e.target.value; F.trang = 1; const c = e.target.selectionStart; veDash(); const t = $('#tim'); t.focus(); t.setSelectionRange(c, c); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'locNam'){ F.nam = e.target.value; F.trang = 1; veDash(); }
  if (e.target.id === 'sapXep'){ F.sx = e.target.value; veDash(); }
  if (e.target.id === 'ttTop'){ P.tt = e.target.value; luu(); veSB(); const s = $('[data-p="tt"]'); if (s) s.value = P.tt; }
});
$('#khoiPhuc').onchange = async e => { const file = e.target.files[0]; if (!file) return;
  try { const o = JSON.parse(await file.text()); const ds = o.ds || o; if (!Array.isArray(ds)) throw 0; const ids = new Set(DS.map(x => x.id)); let n = 0;
    for (const x of ds){ if (!ids.has(x.id)){ chuanHoa(x); DS.push(x); await KHO.ghi(x); n++; } } veTat(); bao('Đã khôi phục ' + n + ' dự án mới'); }
  catch(err){ bao('File sao lưu không hợp lệ'); } e.target.value = ''; };

/* ---------- xuat ---------- */
function bao(t){ const o = $('#toast'); o.textContent = t; o.classList.add('on'); clearTimeout(bao.t); bao.t = setTimeout(() => o.classList.remove('on'), 2600); }
function taiFile(blob, ten){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ten; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
const khongDau = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[\\/:*?"<>|]+/g,'-').trim();
function tenFile(){ const v = VIEW, dd = P.ngay.split('-').reverse().join('-'), ai = khongDau(P.ten || P.kh.cty || 'Du an'), so = P.so.replace('/', '-');
  return {kh: `${so} - Ho so du an - ${ai}`, brief: `${dd} - Branding Brief - ${ai}`, bg: `${dd} - Bao Gia - ${ai}`, hd: `${so} - Hop dong chuyen gia - ${ai}`, dh: `${dd} - Dinh huong thuong hieu - ${ai}`,
    giao: String(P.giao.doc).startsWith('pt') ? `${so} - Phieu thu dot ${+P.giao.doc.slice(2) + 1} - ${ai}` : `${so} - Bien ban nghiem thu - ${ai}`}[v]; }
$('#inPDF').onclick = () => { if (Date.now() - (window._lp || 0) < 1500) return; window._lp = Date.now(); const t = document.title; document.title = tenFile(); window.print(); setTimeout(() => document.title = t, 500); };
$('#chepVB').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('#doc').innerText); bao('Đã chép nội dung văn bản'); };
$('#taiWord').onclick = () => {
  const st = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(tenFile())}</title>
    <style>@page{size:21cm 29.7cm;margin:2cm 2cm 2cm 2.5cm} body{font-family:Arimo,Arial,sans-serif;font-size:11pt;line-height:1.5}${st} .doc{padding:0!important;box-shadow:none;width:auto}</style></head>
    <body><div class="doc">${$('#doc').innerHTML.replace(/<span class="bien">/g, '<span>')}</div></body></html>`;
  taiFile(new Blob(['﻿', html], {type:'application/msword'}), tenFile() + '.doc'); bao('Đã tải file Word');
};

/* ---------- khoi dong ---------- */
nap().then(dinhTuyen);
</script>
</body>
</html>
